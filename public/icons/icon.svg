<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Organized Chaos app icon: a die rolling your next task, in the IDE palette. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171c26"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="90" fill="none" stroke="#232a35" stroke-width="6"/>
  <!-- the die -->
  <rect x="116" y="116" width="280" height="280" rx="48" fill="#11151c" stroke="#d2a8ff" stroke-width="14"/>
  <!-- five pips, each an accent color; center pip is the checkmark -->
  <circle cx="180" cy="180" r="26" fill="#79c0ff"/>
  <circle cx="332" cy="180" r="26" fill="#7ee787"/>
  <circle cx="180" cy="332" r="26" fill="#ffa657"/>
  <circle cx="332" cy="332" r="26" fill="#f778ba"/>
  <path d="M232 256 l20 22 l40 -44" fill="none" stroke="#56d4dd" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
